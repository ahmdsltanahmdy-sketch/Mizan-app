<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خبرگزاری میزان | مینی‌اپ رسمی تلگرام</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Vazirmatn -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: var(--tg-theme-bg-color, #0b1329);
      color: var(--tg-theme-text-color, #f8fafc);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .glass-nav {
      background: rgba(11, 19, 41, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-chip {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
      border-color: transparent !important;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmerAnim 1.4s infinite;
    }
    @keyframes shimmerAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased pb-24">

  <!-- نوار پیشرفت مطالعه بالا -->
  <div id="reading-bar" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-rose-500 to-red-600 z-50 transition-all duration-150 w-0"></div>

  <!-- نوار اعلان فوری اخبار -->
  <div class="bg-gradient-to-r from-rose-900 via-red-800 to-slate-900 text-white text-[11px] px-3.5 py-1.5 flex items-center justify-between shadow-inner">
    <div class="flex items-center gap-2 overflow-hidden flex-1">
      <span class="animate-pulse flex h-2 w-2 rounded-full bg-rose-400 shrink-0"></span>
      <span class="bg-black/40 text-[9px] font-black px-1.5 py-0.5 rounded border border-white/20 shrink-0">فوری</span>
      <span id="ticker-text" class="truncate text-slate-100 font-light">در حال پایش و تازه‌سازی آخرین اخبار میزان...</span>
    </div>
    <span id="live-time" class="text-[10px] text-slate-300 font-mono shrink-0 mr-2"></span>
  </div>

  <!-- هدر مدرن با استایل میزان -->
  <header class="sticky top-0 z-40 glass-nav border-b border-white/10">
    <div class="px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-600 to-red-500 flex items-center justify-center font-black text-white text-base shadow-lg shadow-rose-600/30">
          م
        </div>
        <div>
          <div class="font-black text-sm tracking-tight text-white flex items-center gap-1.5">
            خبرگزاری میزان
            <span class="text-[8px] font-semibold text-rose-400 bg-rose-500/10 px-1.5 py-0.5 rounded-full border border-rose-500/20">رسمی</span>
          </div>
          <div class="text-[9px] text-slate-400 font-medium">پایگاه رسمی قوه قضائیه ایران</div>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="toggleSearchBar()" class="p-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 active:scale-90 transition">
          <svg class="w-4 h-4 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 1114 0z"/></svg>
        </button>
        <button onclick="refreshCurrentFeed()" class="p-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 active:scale-90 transition">
          <svg id="refresh-icon" class="w-4 h-4 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </div>
    </div>

    <!-- فیلد جستجوی زنده -->
    <div id="search-container" class="hidden px-4 pb-2.5">
      <div class="relative">
        <input type="text" id="search-input" oninput="executeLiveSearch()" placeholder="جستجو در متن، احکام، پرونده‌ها..." class="w-full pl-9 pr-3 py-2 text-xs rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:border-rose-500 transition" />
        <button onclick="toggleSearchBar()" class="absolute left-2.5 top-2.5 text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- منوی افقی تب‌ها: دقیقاً به همان ترتیبی که خواستی -->
    <nav class="flex overflow-x-auto hide-scrollbar px-3 py-2 space-x-1.5 space-x-reverse text-xs">
      <button onclick="changeFeed('all', this)" class="nav-chip active-chip px-3 py-1.5 rounded-full text-white font-bold whitespace-nowrap transition">همه اخبار</button>
      <button onclick="changeFeed('judiciary', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">قضایی</button>
      <button onclick="changeFeed('legal_online', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">وکیل آنلاین</button>
      <button onclick="changeFeed('legal_magazine', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">مجله حقوقی</button>
      <button onclick="changeFeed('society', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">جامعه</button>
      <button onclick="changeFeed('politics', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">سیاسی</button>
      <button onclick="changeFeed('international', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">بین‌الملل</button>
      <button onclick="changeFeed('economy', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">اقتصادی</button>
      <button onclick="changeFeed('multimedia', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">چندرسانه‌ای</button>
      <button onclick="changeFeed('culture', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">فرهنگی</button>
      <button onclick="changeFeed('sports', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">ورزشی</button>
      <button onclick="changeFeed('photos', this)" class="nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5">عکس</button>
    </nav>
  </header>

  <!-- بخش اصلی نمایش اخبار -->
  <main class="flex-1 px-4 pt-3 max-w-lg mx-auto w-full">
    
    <!-- کارت سینمایی خبر برگزیده / تیتر یک -->
    <section id="spotlight-box" class="mb-4 hidden">
      <div onclick="openStoryReader(0)" class="relative rounded-3xl overflow-hidden border border-white/10 shadow-2xl cursor-pointer active:scale-[0.99] transition duration-200">
        <img id="spotlight-img" src="" alt="تیتر اول" class="w-full h-52 object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/60 to-transparent flex flex-col justify-end p-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-rose-600 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow">برگزیده</span>
            <span id="spotlight-meta" class="text-[10px] text-slate-300"></span>
          </div>
          <h2 id="spotlight-title" class="text-white font-bold text-sm leading-snug"></h2>
        </div>
      </div>
    </section>

    <!-- لودینگ شیمر سریع -->
    <div id="skeleton-box" class="space-y-3">
      <div class="w-full h-48 rounded-3xl shimmer border border-white/5"></div>
      <div class="p-4 rounded-2xl glass-card space-y-2.5">
        <div class="w-2/3 h-3.5 rounded-lg shimmer"></div>
        <div class="w-full h-2.5 rounded shimmer"></div>
        <div class="w-1/3 h-2.5 rounded shimmer"></div>
      </div>
      <div class="p-4 rounded-2xl glass-card space-y-2.5">
        <div class="w-3/4 h-3.5 rounded-lg shimmer"></div>
        <div class="w-full h-2.5 rounded shimmer"></div>
      </div>
    </div>

    <!-- لیست کارت‌های خبری با گرافیک مدرن -->
    <section id="stream-box" class="space-y-3 hidden"></section>

    <!-- صفحه داخلی مشاهده خبر -->
    <article id="article-view" class="hidden glass-card p-5 rounded-3xl border border-white/10 space-y-4">
      <div class="relative rounded-2xl overflow-hidden border border-white/10">
        <img id="article-img" src="" class="w-full h-56 object-cover hidden" />
        <div class="absolute top-3 left-3">
          <button onclick="readAloud()" id="tts-btn" class="p-2 rounded-xl glass-nav text-white text-xs flex items-center gap-1.5 active:scale-90 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <span id="tts-text" class="text-[10px]">شنیدن خبر</span>
          </button>
        </div>
      </div>

      <div>
        <h1 id="article-title" class="font-black text-base text-white leading-relaxed"></h1>
        <div class="flex items-center justify-between text-[11px] text-slate-400 mt-3 pb-3 border-b border-white/10">
          <div class="flex items-center gap-2">
            <span id="article-time"></span>
            <span>•</span>
            <span id="article-est" class="text-rose-400 font-semibold"></span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="scaleText(-1)" class="w-7 h-7 rounded-lg bg-white/5 text-slate-300 flex items-center justify-center font-bold text-xs">-A</button>
            <button onclick="scaleText(1)" class="w-7 h-7 rounded-lg bg-white/5 text-slate-300 flex items-center justify-center font-bold text-xs">+A</button>
          </div>
        </div>
      </div>

      <div class="bg-gradient-to-r from-rose-950/40 to-slate-900/60 border-r-4 border-rose-500 p-3.5 rounded-2xl">
        <span class="text-[10px] font-extrabold text-rose-400 block mb-1">شرح و جزئیات خبر:</span>
        <p id="article-body" class="text-xs text-slate-200 leading-relaxed text-justify"></p>
      </div>

      <div class="pt-2 space-y-2">
        <div class="flex gap-2">
          <button onclick="toggleArticleSave()" id="save-action-btn" class="flex-1 py-3 bg-white/10 hover:bg-white/15 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
            <span id="save-action-txt">نشان کردن</span>
          </button>
          <button onclick="telegramShare()" class="flex-1 py-3 bg-gradient-to-r from-rose-600 to-red-600 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-lg shadow-rose-600/30 active:scale-95 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            ارسال به تلگرام
          </button>
        </div>
        <button onclick="openExternal()" class="w-full py-2.5 text-center text-xs text-slate-400 hover:text-white transition">
          مشاهده اصل گزارش در وب‌سایت میزان ↗
        </button>
      </div>
    </article>

  </main>

  <!-- نوار دسترسی سریع پایین (Floating Bottom Navigation) -->
  <nav class="fixed bottom-3 inset-x-4 max-w-md mx-auto glass-nav rounded-2xl border border-white/10 p-2 flex justify-around items-center z-40 shadow-2xl">
    <button onclick="switchView('feed')" id="nav-home" class="flex flex-col items-center gap-1 text-rose-500 text-[10px] font-bold">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      جریان خبر
    </button>
    <button onclick="switchView('bookmarks')" id="nav-saved" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px] relative">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
      نشان‌شده‌ها
      <span id="badge-dot" class="hidden absolute top-0 right-3 w-2 h-2 bg-rose-500 rounded-full"></span>
    </button>
    <button onclick="triggerHaptic(); toggleSearchBar();" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 1114 0z"/></svg>
      جستجو
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // نقشه فیدهای رسمی و تست‌شده خبرگزاری میزان
    const ENDPOINTS = {
      all: "https://www.mizanonline.ir/fa/rss/allnews",
      judiciary: "https://www.mizanonline.ir/fa/rss/2",          // قضایی
      legal_online: "https://www.mizanonline.ir/fa/rss/64",     // وکیل آنلاین
      legal_magazine: "https://www.mizanonline.ir/fa/rss/65",   // مجله حقوقی
      society: "https://www.mizanonline.ir/fa/rss/3",           // جامعه
      politics: "https://www.mizanonline.ir/fa/rss/1",          // سیاسی
      international: "https://www.mizanonline.ir/fa/rss/8",     // بین‌الملل
      economy: "https://www.mizanonline.ir/fa/rss/4",           // اقتصادی
      multimedia: "https://www.mizanonline.ir/fa/rss/6",        // چندرسانه‌ای
      culture: "https://www.mizanonline.ir/fa/rss/5",           // فرهنگی
      sports: "https://www.mizanonline.ir/fa/rss/7",            // ورزشی
      photos: "https://www.mizanonline.ir/fa/rss/10"           // عکس
    };

    let newsData = [];
    let currentCategoryKey = "all";
    let activeStory = null;
    let textScale = 12;
    let isSpeaking = false;

    document.addEventListener("DOMContentLoaded", () => {
      startClock();
      changeFeed('all', document.querySelector('.nav-chip'));
      
      tg.BackButton.onClick(() => closeReader());
      updateBookmarkDot();

      window.addEventListener('scroll', () => {
        const total = document.documentElement.scrollHeight - window.innerHeight;
        if (total > 0) {
          const progress = (window.scrollY / total) * 100;
          document.getElementById("reading-bar").style.width = `${progress}%`;
        }
      });
    });

    function startClock() {
      const el = document.getElementById("live-time");
      const tick = () => {
        const d = new Date();
        el.innerText = d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      };
      tick();
      setInterval(tick, 30000);
    }

    function triggerHaptic(type = 'light') {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
    }

    // واکشی بدون کَش و بدون توقف با سیستم Multi-Proxy
    async function fetchLiveNews(feedUrl) {
      const cacheBuster = `&_cb=${Date.now()}`;
      
      // تلاش اول: سرور سریع rss2json با پارامتر تازه‌سازی
      try {
        const p1 = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}${cacheBuster}`;
        const res = await fetch(p1);
        const json = await res.json();
        if (json.status === "ok" && json.items && json.items.length > 0) {
          return json.items;
        }
      } catch (e) {
        console.warn("Primary proxy bypassed");
      }

      // تلاش دوم (Fallback پایدار): AllOrigins به صورت خام و پارس XML
      try {
        const p2 = `https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}&timestamp=${Date.now()}`;
        const res = await fetch(p2);
        const json = await res.json();
        const xml = new DOMParser().parseFromString(json.contents, "text/xml");
        const rawItems = Array.from(xml.querySelectorAll("item"));
        
        if (rawItems.length > 0) {
          return rawItems.map(i => ({
            title: i.querySelector("title")?.textContent || "",
            link: i.querySelector("link")?.textContent || "",
            pubDate: i.querySelector("pubDate")?.textContent || "",
            description: i.querySelector("description")?.textContent || "",
            enclosure: { link: i.querySelector("enclosure")?.getAttribute("url") || "" }
          }));
        }
      } catch (err) {
        console.error("Secondary proxy bypassed");
      }

      // تلاش سوم: CodeTabs CORS Proxy
      try {
        const p3 = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(feedUrl)}`;
        const res = await fetch(p3);
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        return Array.from(xml.querySelectorAll("item")).map(i => ({
          title: i.querySelector("title")?.textContent || "",
          link: i.querySelector("link")?.textContent || "",
          pubDate: i.querySelector("pubDate")?.textContent || "",
          description: i.querySelector("description")?.textContent || "",
          enclosure: { link: i.querySelector("enclosure")?.getAttribute("url") || "" }
        }));
      } catch (finalErr) {
        console.error("Fetch failed on all routes", finalErr);
        return [];
      }
    }

    async function changeFeed(key, btn) {
      triggerHaptic('light');
      currentCategoryKey = key;

      document.querySelectorAll(".nav-chip").forEach(b => {
        b.className = "nav-chip px-3 py-1.5 rounded-full text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/5";
      });
      if (btn) btn.className = "nav-chip active-chip px-3 py-1.5 rounded-full text-white font-bold whitespace-nowrap transition";

      closeReader();
      showSkeletons(true);

      const targetUrl = ENDPOINTS[key] || ENDPOINTS.all;
      const rawItems = await fetchLiveNews(targetUrl);

      newsData = rawItems.map(item => {
        let img = item.enclosure?.link || item.thumbnail || "";
        if (!img && item.description) {
          const m = item.description.match(/<img[^>]+src="([^">]+)"/);
          if (m) img = m[1];
        }
        const text = (item.description || "").replace(/<[^>]+>/g, "").trim();

        return {
          title: item.title,
          link: item.link,
          pubDate: item.pubDate,
          summary: text || "متن این گزارش در پایگاه خبرگزاری میزان در دسترس است.",
          image: img
        };
      });

      if (newsData.length > 0) {
        document.getElementById("ticker-text").innerText = newsData[0].title;
      }

      renderFeedCards(newsData);
      showSkeletons(false);
    }

    function refreshCurrentFeed() {
      const icon = document.getElementById("refresh-icon");
      icon.classList.add("animate-spin");
      triggerHaptic('medium');
      changeFeed(currentCategoryKey, null).then(() => {
        setTimeout(() => icon.classList.remove("animate-spin"), 500);
      });
    }

    function renderFeedCards(items) {
      const stream = document.getElementById("stream-box");
      const hero = document.getElementById("spotlight-box");
      stream.innerHTML = "";

      if (!items || !items.length) {
        stream.innerHTML = `
          <div class="text-center py-16">
            <p class="text-xs text-slate-400">در حال حاضر خبری در این بخش موجود نیست یا اینترنت متصل نیست</p>
            <button onclick="refreshCurrentFeed()" class="mt-3 px-4 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold">تلاش مجدد و تازه‌سازی</button>
          </div>`;
        hero.classList.add("hidden");
        return;
      }

      // کارت سینمایی خبر برگزیده
      if (items[0].image) {
        document.getElementById("spotlight-img").src = items[0].image;
        document.getElementById("spotlight-title").innerText = items[0].title;
        document.getElementById("spotlight-meta").innerText = items[0].pubDate ? items[0].pubDate.split(' ')[0] : 'امروز';
        hero.classList.remove("hidden");
      } else {
        hero.classList.add("hidden");
      }

      const list = items[0].image ? items.slice(1) : items;
      list.forEach((entry, idx) => {
        const realIdx = items[0].image ? idx + 1 : idx;
        const card = document.createElement("div");
        card.className = "glass-card p-3 rounded-2xl flex gap-3 cursor-pointer active:scale-[0.99] transition duration-150";
        card.onclick = () => openStoryReader(realIdx);

        card.innerHTML = `
          ${entry.image ? `<img src="${entry.image}" loading="lazy" class="w-20 h-20 rounded-xl object-cover flex-shrink-0 bg-slate-800 border border-white/5" />` : ''}
          <div class="flex flex-col justify-between flex-1 min-w-0 py-0.5">
            <h3 class="font-bold text-xs text-slate-100 leading-snug line-clamp-2">${entry.title}</h3>
            <div class="flex items-center justify-between text-[10px] text-slate-400 mt-2">
              <span>${entry.pubDate ? entry.pubDate.split(' ')[0] : 'لحظاتی پیش'}</span>
              <span class="text-rose-400 font-bold">مشاهده گزارش ←</span>
            </div>
          </div>
        `;
        stream.appendChild(card);
      });
    }

    function openStoryReader(index) {
      triggerHaptic('light');
      activeStory = newsData[index];

      document.getElementById("spotlight-box").classList.add("hidden");
      document.getElementById("stream-box").classList.add("hidden");
      document.getElementById("article-view").classList.remove("hidden");

      const img = document.getElementById("article-img");
      if (activeStory.image) {
        img.src = activeStory.image;
        img.classList.remove("hidden");
      } else {
        img.classList.add("hidden");
      }

      document.getElementById("article-title").innerText = activeStory.title;
      document.getElementById("article-time").innerText = activeStory.pubDate || '';
      
      const words = (activeStory.summary || "").split(' ').length;
      document.getElementById("article-est").innerText = `${Math.max(1, Math.round(words / 35))} دقیقه مطالعه`;
      document.getElementById("article-body").innerText = activeStory.summary;

      tg.BackButton.show();
      syncSaveButton();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeReader() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      document.getElementById("article-view").classList.add("hidden");
      document.getElementById("stream-box").classList.remove("hidden");
      if (newsData.length && newsData[0].image) {
        document.getElementById("spotlight-box").classList.remove("hidden");
      }
      tg.BackButton.hide();
      activeStory = null;
    }

    function scaleText(step) {
      textScale = Math.min(18, Math.max(11, textScale + step));
      document.getElementById("article-body").style.fontSize = `${textScale}px`;
    }

    function readAloud() {
      if (!('speechSynthesis' in window)) {
        alert("قابلیت صوتی در این نسخه پشتیبانی نمی‌شود");
        return;
      }
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        document.getElementById("tts-text").innerText = "شنیدن خبر";
        return;
      }
      const utter = new SpeechSynthesisUtterance(activeStory.title + ". " + activeStory.summary);
      utter.lang = 'fa-IR';
      utter.onend = () => {
        isSpeaking = false;
        document.getElementById("tts-text").innerText = "شنیدن خبر";
      };
      window.speechSynthesis.speak(utter);
      isSpeaking = true;
      document.getElementById("tts-text").innerText = "توقف صوت";
    }

    function showSkeletons(show) {
      document.getElementById("skeleton-box").classList.toggle("hidden", !show);
      document.getElementById("stream-box").classList.toggle("hidden", show);
      if (show) document.getElementById("spotlight-box").classList.add("hidden");
    }

    function toggleSearchBar() {
      const sc = document.getElementById("search-container");
      sc.classList.toggle("hidden");
      if (!sc.classList.contains("hidden")) document.getElementById("search-input").focus();
    }

    // موتور سرچ آنی سریع و ترکیبی
    function executeLiveSearch() {
      const query = document.getElementById("search-input").value.trim().toLowerCase();
      if (!query) {
        renderFeedCards(newsData);
        return;
      }
      const matched = newsData.filter(x => 
        (x.title && x.title.toLowerCase().includes(query)) || 
        (x.summary && x.summary.toLowerCase().includes(query))
      );
      renderFeedCards(matched);
    }

    function getStoredFavs() {
      return JSON.parse(localStorage.getItem("mizan_tg_favs") || "[]");
    }

    function toggleArticleSave() {
      if (!activeStory) return;
      let favs = getStoredFavs();
      const exists = favs.findIndex(f => f.link === activeStory.link);
      if (exists > -1) {
        favs.splice(exists, 1);
      } else {
        favs.push(activeStory);
      }
      localStorage.setItem("mizan_tg_favs", JSON.stringify(favs));
      triggerHaptic('medium');
      syncSaveButton();
      updateBookmarkDot();
    }

    function syncSaveButton() {
      if (!activeStory) return;
      const isSaved = getStoredFavs().some(f => f.link === activeStory.link);
      document.getElementById("save-action-txt").innerText = isSaved ? "نشان شده ✓" : "نشان کردن";
      document.getElementById("save-action-btn").className = isSaved 
        ? "flex-1 py-3 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5"
        : "flex-1 py-3 bg-white/10 hover:bg-white/15 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-1.5";
    }

    function updateBookmarkDot() {
      const dot = document.getElementById("badge-dot");
      dot.classList.toggle("hidden", getStoredFavs().length === 0);
    }

    function switchView(view) {
      triggerHaptic('light');
      const homeBtn = document.getElementById("nav-home");
      const saveBtn = document.getElementById("nav-saved");

      if (view === 'bookmarks') {
        closeReader();
        homeBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px]";
        saveBtn.className = "flex flex-col items-center gap-1 text-rose-500 text-[10px] font-bold relative";
        renderFeedCards(getStoredFavs());
        document.getElementById("spotlight-box").classList.add("hidden");
      } else {
        homeBtn.className = "flex flex-col items-center gap-1 text-rose-500 text-[10px] font-bold";
        saveBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px] relative";
        changeFeed(currentCategoryKey, null);
      }
    }

    function telegramShare() {
      if (!activeStory) return;
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(activeStory.link)}&text=${encodeURIComponent(activeStory.title + "\n\nخبرگزاری میزان:")}`;
      tg.openTelegramLink(shareUrl);
    }

    function openExternal() {
      if (activeStory && activeStory.link) tg.openLink(activeStory.link);
    }
  </script>
</body>
</html>
