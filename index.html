    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.12s ease, background 0.12s ease;

    @keyframes shimmerAnim {
      0% { background-position: 200% 0; }

    .line-clamp-2 {

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // فیدهای اختصاصی به همراه لینک دقیق «وکیل آنلاین» به نشانی https://www.mizanonline.ir/fa/message
    const ENDPOINTS = {
      all: { url: "https://www.mizanonline.ir/fa/rss/allnews", name: "همه اخبار" },
      judiciary: { url: "https://www.mizanonline.ir/fa/rss/17", name: "قضایی" },
      human_rights: { url: "https://www.mizanonline.ir/fa/rss/7", name: "حقوق بشر" },
      lawyer_online: { url: "https://www.mizanonline.ir/fa/rss/message", name: "وکیل آنلاین" },
      legal_magazine: { url: "https://www.mizanonline.ir/fa/rss/16", name: "مجله حقوقی" },
      society: { url: "https://www.mizanonline.ir/fa/rss/9", name: "جامعه" },
      politics: { url: "https://www.mizanonline.ir/fa/rss/10", name: "سیاست" },
      economy: { url: "https://www.mizanonline.ir/fa/rss/10", name: "اقتصاد" },
      culture: { url: "https://www.mizanonline.ir/fa/rss/12", name: "فرهنگی" },
      sports: { url: "https://www.mizanonline.ir/fa/rss/13", name: "ورزشی" },
      world: { url: "https://www.mizanonline.ir/fa/rss/14", name: "جهان" },
      multimedia: { url: "https://www.mizanonline.ir/fa/rss/2", name: "چندرسانه‌ای" },
      infographic: { url: "https://www.mizanonline.ir/fa/rss/3", name: "اینفوگرافیک" },
      photos: { url: "https://www.mizanonline.ir/fa/rss/4", name: "عکس" }
    };

    let newsData = [];
    let displayedCount = 0;
    const batchSize = 12;
    let currentCategoryKey = "all";
    let currentCategoryName = "همه اخبار";
    let activeStory = null;
    let isSpeaking = false;
    let isLoadingMore = false;

    // حافظه پنهان محلی برای دسترسی آنی و بدون تأخیر (Instant Cache)
    const feedCache = {};

    document.addEventListener("DOMContentLoaded", () => {
      startClock();
      changeFeed('all', 'همه اخبار', document.querySelector('.nav-chip'));
      
      tg.BackButton.onClick(() => closeReader());
      updateBookmarkDot();

      window.addEventListener('scroll', () => {
        const total = document.documentElement.scrollHeight - window.innerHeight;
        if (total > 0) {
          const progress = (window.scrollY / total) * 100;
          document.getElementById("reading-bar").style.width = `${progress}%`;
        }

        if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 350) {
          loadMoreNews();
        }
      });
    });

    function startClock() {
      const el = document.getElementById("live-time");
      const tick = () => {
        const d = new Date();
        el.innerText = d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      };
      tick();
      setInterval(tick, 30000);
    }

    function triggerHaptic(type = 'light') {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
    }

    // موتور واکشی فوق‌سریع و مجهز به کش آنی برای حذف هرگونه تاخیر
    async function fetchLiveNews(feedUrl, forceRefresh = false) {
      if (!forceRefresh && feedCache[feedUrl]) {
        return feedCache[feedUrl];
      }

      const uniqueParam = `&_cb=${Date.now()}`;
      const proxies = [
        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}${uniqueParam}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl + (feedUrl.includes('?') ? '&' : '?') + 'nocache=' + Date.now())}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(feedUrl + '&rnd=' + Date.now())}`
      ];

      for (const p of proxies) {
        try {
          const res = await fetch(p, { cache: 'no-store' });
          if (!res.ok) continue;

          if (p.includes('rss2json')) {
            const json = await res.json();
            if (json.status === "ok" && json.items && json.items.length > 0) {
              feedCache[feedUrl] = json.items;
              return json.items;
            }
          } else {
            const text = await res.text();
            let xmlString = text;
            if (p.includes('allorigins')) {
              try {
                const json = JSON.parse(text);
                xmlString = json.contents;
              } catch(err) {}
            }
            const xml = new DOMParser().parseFromString(xmlString, "text/xml");
            const items = Array.from(xml.querySelectorAll("item"));
            if (items.length > 0) {
              const mapped = items.map(i => ({
                title: i.querySelector("title")?.textContent || "",
                link: i.querySelector("link")?.textContent || "",
                pubDate: i.querySelector("pubDate")?.textContent || "",
                description: i.querySelector("description")?.textContent || "",
                enclosure: { link: i.querySelector("enclosure")?.getAttribute("url") || "" }
              }));
              feedCache[feedUrl] = mapped;
              return mapped;
            }
          }
        } catch (e) {
          continue;
        }
      }
      return [];
    }

    async function changeFeed(key, name, btn, forceRefresh = false) {
      triggerHaptic('medium');
      currentCategoryKey = key;
      currentCategoryName = name;

      document.querySelectorAll(".nav-chip").forEach(b => {
        b.className = "nav-chip px-3.5 py-2 rounded-2xl text-slate-300 font-medium whitespace-nowrap transition bg-white/5 border border-white/10";
      });
      if (btn) btn.className = "nav-chip active-chip px-3.5 py-2 rounded-2xl text-white font-bold whitespace-nowrap transition";

      closeReader();
      
      // اگر دیتا در کش بود، بدون لودینگ شیمر نمایش بده تا سرعت صفر تا صد آنی باشد
      const target = ENDPOINTS[key] || ENDPOINTS.all;
      if (!forceRefresh && feedCache[target.url]) {
        processNewsItems(feedCache[target.url], name);
        return;
      }

      showSkeletons(true);
      const rawItems = await fetchLiveNews(target.url, forceRefresh);
      processNewsItems(rawItems, name);
      showSkeletons(false);
    }

    function processNewsItems(rawItems, name) {
      newsData = rawItems.map(item => {
        let img = item.enclosure?.link || item.thumbnail || "";
        if (!img && item.description) {
          const m = item.description.match(/<img[^>]+src="([^">]+)"/);
          if (m) img = m[1];
        }
        const text = (item.description || "").replace(/<[^>]+>/g, "").trim();

        return {
          title: item.title,
          link: item.link,
          pubDate: item.pubDate,
          summary: text || "مشاهده متن کامل این گزارش در پایگاه خبرگزاری میزان.",
          image: img,
          categoryName: name
        };
      });

      if (newsData.length > 0) {
        document.getElementById("ticker-text").innerText = newsData[0].title;
      }

      displayedCount = 0;
      renderInitialFeed(newsData);
    }

    function refreshCurrentFeed() {
      const icon = document.getElementById("refresh-icon");
      icon.classList.add("animate-spin");
      triggerHaptic('heavy');
      changeFeed(currentCategoryKey, currentCategoryName, null, true).then(() => {
        setTimeout(() => icon.classList.remove("animate-spin"), 400);
      });
    }

    function renderInitialFeed(items) {
      const stream = document.getElementById("stream-box");
      const hero = document.getElementById("spotlight-box");
      stream.innerHTML = "";

      if (!items || !items.length) {
        stream.innerHTML = `
          <div class="text-center py-20">
            <p class="text-xs text-slate-400 mb-3">در حال حاضر خبری در این بخش دریافت نشد</p>
            <button onclick="refreshCurrentFeed()" class="px-4 py-2.5 bg-rose-600 text-white rounded-xl text-xs font-bold shadow-lg">تلاش مجدد و تازه‌سازی</button>
          </div>`;
        hero.classList.add("hidden");
        return;
      }

      // بنر عریض آخرین خبر دقیقاً مشابه تصویر ارسالی شما
      if (items[0].image) {
        document.getElementById("spotlight-img").src = items[0].image;
        document.getElementById("spotlight-title").innerText = items[0].title;
        document.getElementById("spotlight-meta").innerText = items[0].pubDate ? items[0].pubDate.split(' ')[0] : 'امروز';
        document.getElementById("spotlight-badge").innerText = items[0].categoryName || currentCategoryName;
        hero.classList.remove("hidden");
      } else {
        hero.classList.add("hidden");
      }

      displayedCount = 1; 
      loadMoreNews();
    }

    function loadMoreNews() {
      if (isLoadingMore || displayedCount >= newsData.length) return;
      isLoadingMore = true;
      document.getElementById("infinite-loader").classList.remove("hidden");

      setTimeout(() => {
        const stream = document.getElementById("stream-box");
        const nextEnd = Math.min(displayedCount + batchSize, newsData.length);
        
        for (let i = displayedCount; i < nextEnd; i++) {
          const entry = newsData[i];
          const card = document.createElement("div");
          // گرافیک دقیق منطبق با تصویر ارسالی: کادر شیشه‌ای عریض، عنوان راست‌چین، تاریخ، و دکمه «مشاهده گزارش ←» در سمت چپ پایین همراه با عکس کوچک در سمت چپ
          card.className = "glass-card p-4 rounded-2xl flex items-center justify-between cursor-pointer active:scale-[0.99] transition duration-150 mb-3.5";
          card.onclick = () => openStoryReader(i);

          card.innerHTML = `
            <div class="flex-1 min-w-0 pl-3">
              <div class="flex items-center gap-1.5 mb-1.5">
                <span class="bg-rose-500/15 text-rose-300 border border-rose-500/30 text-[9px] font-bold px-2 py-0.5 rounded-full">${entry.categoryName || currentCategoryName}</span>
                <span class="text-[9px] text-slate-400 font-mono">${entry.pubDate ? entry.pubDate.split(' ')[0] : ''}</span>
              </div>
              <h3 class="font-bold text-xs text-slate-100 leading-snug line-clamp-2">${entry.title}</h3>
              <div class="flex items-center justify-between mt-3 text-[10px]">
                <span class="text-rose-400 font-bold">مشاهده گزارش ←</span>
              </div>
            </div>
            ${entry.image ? `<img src="${entry.image}" loading="lazy" class="w-20 h-20 rounded-2xl object-cover flex-shrink-0 bg-slate-900 border border-white/10" />` : ''}
          `;
          stream.appendChild(card);
        }

        displayedCount = nextEnd;
        isLoadingMore = false;
        document.getElementById("infinite-loader").classList.add("hidden");
      }, 100);
    }

    function openStoryReader(index) {
      triggerHaptic('medium');
      activeStory = newsData[index];

      document.getElementById("spotlight-box").classList.add("hidden");
      document.getElementById("stream-box").classList.add("hidden");
      document.getElementById("infinite-loader").classList.add("hidden");
      document.getElementById("article-view").classList.remove("hidden");

      const img = document.getElementById("article-img");
      if (activeStory.image) {
        img.src = activeStory.image;
        img.classList.remove("hidden");
      } else {
        img.classList.add("hidden");
      }

      document.getElementById("article-title").innerText = activeStory.title;
      document.getElementById("article-time").innerText = activeStory.pubDate || '';
      document.getElementById("article-badge").innerText = activeStory.categoryName || currentCategoryName;
      document.getElementById("article-body").innerText = activeStory.summary;

      tg.BackButton.show();
      syncSaveButton();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeReader() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      document.getElementById("article-view").classList.add("hidden");
      document.getElementById("stream-box").classList.remove("hidden");
      if (newsData.length && newsData[0].image) {
        document.getElementById("spotlight-box").classList.remove("hidden");
      }
      tg.BackButton.hide();
      activeStory = null;
    }

    function readAloud() {
      if (!('speechSynthesis' in window)) return;
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        document.getElementById("tts-text").innerText = "شنیدن خبر";
        return;
      }
      const utter = new SpeechSynthesisUtterance(activeStory.title + ". " + activeStory.summary);
      utter.lang = 'fa-IR';
      utter.onend = () => {
        isSpeaking = false;
        document.getElementById("tts-text").innerText = "شنیدن خبر";
      };
      window.speechSynthesis.speak(utter);
      isSpeaking = true;
      document.getElementById("tts-text").innerText = "توقف صوت";
    }

    function showSkeletons(show) {
      document.getElementById("skeleton-box").classList.toggle("hidden", !show);
      document.getElementById("stream-box").classList.toggle("hidden", show);
      if (show) document.getElementById("spotlight-box").classList.add("hidden");
    }

    function toggleSearchBar() {
      const sc = document.getElementById("search-container");
      sc.classList.toggle("hidden");
      if (!sc.classList.contains("hidden")) document.getElementById("search-input").focus();
    }

    function executeLiveSearch() {
      const query = document.getElementById("search-input").value.trim().toLowerCase();
      if (!query) {
        displayedCount = 1;
        renderInitialFeed(newsData);
        return;
      }
      const matched = newsData.filter(x => 
        (x.title && x.title.toLowerCase().includes(query)) || 
        (x.summary && x.summary.toLowerCase().includes(query))
      );
      const stream = document.getElementById("stream-box");
      stream.innerHTML = "";
      document.getElementById("spotlight-box").classList.add("hidden");

      matched.forEach((entry, idx) => {
        const card = document.createElement("div");
        card.className = "glass-card p-4 rounded-2xl flex items-center justify-between cursor-pointer active:scale-[0.99] transition duration-150 mb-3.5";
        card.onclick = () => {
          const originalIdx = newsData.findIndex(n => n.link === entry.link);
          openStoryReader(originalIdx !== -1 ? originalIdx : idx);
        };
        card.innerHTML = `
          <div class="flex-1 min-w-0 pl-3">
            <div class="flex items-center gap-1.5 mb-1.5">
              <span class="bg-rose-500/15 text-rose-300 border border-rose-500/30 text-[9px] font-bold px-2 py-0.5 rounded-full">${entry.categoryName || currentCategoryName}</span>
              <span class="text-[9px] text-slate-400 font-mono">${entry.pubDate ? entry.pubDate.split(' ')[0] : ''}</span>
            </div>
            <h3 class="font-bold text-xs text-slate-100 leading-snug line-clamp-2">${entry.title}</h3>
            <div class="flex items-center justify-between mt-3 text-[10px]">
              <span class="text-rose-400 font-bold">مشاهده گزارش ←</span>
            </div>
          </div>
          ${entry.image ? `<img src="${entry.image}" loading="lazy" class="w-20 h-20 rounded-2xl object-cover flex-shrink-0 bg-slate-900 border border-white/10" />` : ''}
        `;
        stream.appendChild(card);
      });
    }

    function getStoredFavs() {
      return JSON.parse(localStorage.getItem("mizan_tg_favs") || "[]");
    }

    function toggleArticleSave() {
      if (!activeStory) return;
      let favs = getStoredFavs();
      const exists = favs.findIndex(f => f.link === activeStory.link);
      if (exists > -1) {
        favs.splice(exists, 1);
      } else {
        favs.push(activeStory);
      }
      localStorage.setItem("mizan_tg_favs", JSON.stringify(favs));
      triggerHaptic('heavy');
      syncSaveButton();
      updateBookmarkDot();
    }

    function syncSaveButton() {
      if (!activeStory) return;
      const isSaved = getStoredFavs().some(f => f.link === activeStory.link);
      document.getElementById("save-action-txt").innerText = isSaved ? "نشان شده ✓" : "نشان کردن";
      document.getElementById("save-action-btn").className = isSaved 
        ? "flex-1 py-3.5 bg-rose-600/30 text-rose-300 border border-rose-500/40 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg"
        : "flex-1 py-3.5 bg-white/10 hover:bg-white/15 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-2 border border-white/10 shadow-lg";
    }

    function updateBookmarkDot() {
      const dot = document.getElementById("badge-dot");
      dot.classList.toggle("hidden", getStoredFavs().length === 0);
    }

    function switchView(view) {
      triggerHaptic('medium');
      const homeBtn = document.getElementById("nav-home");
      const saveBtn = document.getElementById("nav-saved");

      if (view === 'bookmarks') {
        closeReader();
        homeBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px]";
        saveBtn.className = "flex flex-col items-center gap-1 text-rose-500 text-[10px] font-bold relative";
        
        const favs = getStoredFavs();
        newsData = favs;
        document.getElementById("spotlight-box").classList.add("hidden");
        displayedCount = 0;
        loadMoreNews();
      } else {
        homeBtn.className = "flex flex-col items-center gap-1 text-rose-500 text-[10px] font-bold";
        saveBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-white text-[10px] relative";
        changeFeed(currentCategoryKey, currentCategoryName, null);
      }
    }

    function telegramShare() {
      if (!activeStory) return;
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(activeStory.link)}&text=${encodeURIComponent(activeStory.title + "\n\nخبرگزاری میزان:")}`;
      tg.openTelegramLink(shareUrl);
    }

    function openExternal() {
      if (activeStory && activeStory.link) tg.openLink(activeStory.link);
    }
  </script>
</body>
</html>
